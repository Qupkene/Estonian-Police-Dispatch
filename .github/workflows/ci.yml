name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every update that reaches the game bumps the version (CLAUDE.md, "Versioon").
  version:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the version
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"; head="$PR_HEAD"
          elif [ "$REF" = "refs/heads/main" ]; then
            # A push to main compares with the main it replaced (a new branch has no "before").
            base="$BEFORE"; head="$GITHUB_SHA"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous main to compare with."; exit 0
            fi
          else
            base="origin/main"; head="$GITHUB_SHA"
          fi
          node scripts/check-version.mjs --base "$base" --head "$head"

  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The PHP API (server/) is tested against `php -S`, the same PHP the FrankenPHP image ships.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: PHP lint
        run: |
          if [ -d server ]; then find server -name '*.php' -print0 | xargs -0 -r -n1 php -l; fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The e2e suite is still being written; do not block merges on it yet.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The PHP API (server/) is tested against `php -S`, the same PHP the FrankenPHP image ships.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # playwright.config.ts starts `npm run preview` on :4173 itself.
      # The html reporter is added here so there is a report to upload on failure.
      - name: Run e2e tests
        run: npm run e2e -- --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
