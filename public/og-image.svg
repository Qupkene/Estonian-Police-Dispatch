<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Vector variant of og-image.png (the link preview uses the PNG, which shows a real game screenshot).
       Original EPD emblem, not the PPA logo. Mitteametlik fännimäng, ei ole seotud PPA-ga. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset=".7" stop-color="#06090d"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".38" r=".62"><stop offset="0" stop-color="#3d8bff" stop-opacity=".24"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e2a38" stroke-width="1"/></pattern>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15386b"/><stop offset="1" stop-color="#071324"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc4ff"/><stop offset=".5" stop-color="#3d8bff"/><stop offset="1" stop-color="#1d4fd8"/></linearGradient>
    <linearGradient id="p" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f5fe8"/><stop offset="1" stop-color="#7aa5ff"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#eaf1f8"/><stop offset=".75" stop-color="#7fe6ff"/><stop offset="1" stop-color="#00d0ff"/></linearGradient>
    <path id="pt" d="M-1 -2.4L-3 -7.9L-3.9 -9.9L-2.4 -9.4L-1.3 -10.7L0 -9.5L1.3 -10.7L2.4 -9.4L3.9 -9.9L3 -7.9L1 -2.4Z" stroke="#0b1d3d" stroke-width=".35"/>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".45"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Dispatch screen: unit ring around an incident, as on the in-game map. -->
  <g transform="translate(900 300)">
    <rect x="-330" y="-240" width="560" height="440" rx="16" fill="#0b1118" fill-opacity=".85" stroke="#3a4e66"/>
    <g fill="none" stroke="#00d0ff" stroke-opacity=".2"><circle r="190"/><circle r="130"/><circle r="70"/></g>
    <path d="M0 0L190 0A190 190 0 0 0 164.5 -95Z" fill="#00d0ff" fill-opacity=".12"/>
    <circle r="20" fill="#ff3b4e" fill-opacity=".2"/><circle r="11" fill="#ff3b4e" stroke="#ffd2d7" stroke-width="2"/>
    <circle cx="96" cy="-58" r="7" fill="#3d8bff"/><circle cx="-120" cy="74" r="7" fill="#22c55e"/><circle cx="40" cy="128" r="6" fill="#f59e0b"/><circle cx="-60" cy="-140" r="6" fill="#3d8bff"/>
  </g>
  <g transform="translate(640 392)">
    <rect width="392" height="96" rx="12" fill="#0d141d" stroke="#3a4e66"/>
    <rect width="4" height="96" rx="2" fill="#ff3b4e"/>
    <circle cx="40" cy="48" r="22" fill="#ff3b4e" fill-opacity=".16"/>
    <path d="M31 38l5-2 4 7-3 3a14 14 0 0 0 7 7l3-3 7 4-2 5c-12 1-22-9-21-21z" fill="none" stroke="#ff6b7a" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="78" y="32" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ff6b7a">112 · UUS KÕNE</text>
    <text x="78" y="58" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="21" font-weight="700" fill="#eaf1f8">Liiklusõnnetus, kannatanu</text>
    <text x="78" y="80" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#93a2b4">P1 · Tartu mnt 54, Tallinn</text>
  </g>

  <g transform="translate(64 56)">
    <g transform="scale(1)">
      <path d="M32 3C39 6.5 47 7.6 55 7V29.5C55 45 45.5 54.5 32 61C18.5 54.5 9 45 9 29.5V7C17 7.6 25 6.5 32 3Z" fill="url(#f)" stroke="url(#r)" stroke-width="2.6" stroke-linejoin="round"/>
      <g transform="translate(32 23.2) scale(1.08)"><use href="#pt" transform="rotate(0)" fill="url(#p)"/><use href="#pt" transform="rotate(45)" fill="url(#p)"/><use href="#pt" transform="rotate(90)" fill="url(#p)"/><use href="#pt" transform="rotate(135)" fill="url(#p)"/><use href="#pt" transform="rotate(180)" fill="url(#p)"/><use href="#pt" transform="rotate(225)" fill="url(#p)"/><use href="#pt" transform="rotate(270)" fill="url(#p)"/><use href="#pt" transform="rotate(315)" fill="url(#p)"/><use href="#pt" transform="rotate(22.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(67.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(112.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(157.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(202.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(247.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(292.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><use href="#pt" transform="rotate(337.5) scale(.62)" fill="#9cc0ff" stroke-width=".4"/><circle r="2.7" fill="#2a1f66" stroke="#0b1d3d" stroke-width=".4"/></g>
      <path d="M26.4 38.6h-4.7v7.4h4.7M21.7 42.3h3.9M29.5 46V38.6h3a2.25 2.25 0 0 1 0 4.5h-3M37.3 38.6h2.3a3.7 3.7 0 0 1 0 7.4h-2.3z" fill="none" stroke="#eaf1f8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="80" y="38" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4.4" fill="#00d0ff">JUHTIMISKESKUSE SIMULAATOR</text>
  </g>
  <text x="58" y="255" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="148" font-weight="800" letter-spacing="3" fill="url(#t)">EPD</text>
  <text x="64" y="330" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="46" font-weight="700" fill="#eaf1f8">Eesti Politsei Dispetšer</text>
  <text font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" fill="#c0ccd9"><tspan x="64" y="384">112-kõned, patrullid ja jälitused päris Eesti</tspan><tspan x="64" y="418">kaardil. Mängi tasuta otse brauseris.</tspan></text>
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#eaf1f8">
    <rect x="64" y="452" width="150" height="38" rx="19" fill="#111a24" stroke="#2a3a4e"/><circle cx="84" cy="471" r="4" fill="#3d8bff"/><text x="96" y="477">4 prefektuuri</text>
    <rect x="224" y="452" width="214" height="38" rx="19" fill="#111a24" stroke="#2a3a4e"/><circle cx="244" cy="471" r="4" fill="#f2c14e"/><text x="256" y="477">250+ sündmusetüüpi</text>
    <rect x="448" y="452" width="104" height="38" rx="19" fill="#111a24" stroke="#2a3a4e"/><circle cx="468" cy="471" r="4" fill="#22c55e"/><text x="480" y="477">ET / EN</text>
  </g>
  <rect x="64" y="565" width="12" height="12" rx="3" fill="#00d0ff"/>
  <text x="88" y="582" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#eaf1f8">politsei.eu</text>
  <rect x="718" y="552" width="418" height="40" rx="10" fill="#06090d" fill-opacity=".85" stroke="#2a3a4e"/>
  <text x="927" y="578" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="17" font-weight="600" fill="#c0ccd9">Mitteametlik fännimäng · ei ole seotud PPA-ga</text>
</svg>
