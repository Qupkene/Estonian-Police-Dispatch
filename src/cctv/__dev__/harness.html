<!doctype html>
<!-- Dev-only harness for the camera picture (not part of the app build). Serve with
     `npx vite --config src/map/__dev__/vite.harness.config.ts --port 5392` and open
     /src/cctv/__dev__/harness.html?kind=street&seed=3&hour=14&month=7&weather=clear&scene=poses -->
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPD camera harness</title>
    <style>
      body { margin: 0; background: #111; color: #ccc; font: 12px monospace; }
      canvas { display: block; width: 1024px; height: 576px; image-rendering: auto; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <pre id="log"></pre>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
